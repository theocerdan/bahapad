<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#3a2a8c"/>
      <stop offset="1" stop-color="#0b0b2a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="70" cy="90" r="4"/><circle cx="430" cy="70" r="5"/><circle cx="460" cy="220" r="3"/>
    <circle cx="60" cy="300" r="3"/><circle cx="110" cy="440" r="4"/><circle cx="380" cy="460" r="3"/>
    <path d="M150 60 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 Z" fill="#ffd23f"/>
    <path d="M420 330 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z" fill="#00ffdd"/>
  </g>
  <!-- planet -->
  <circle cx="420" cy="420" r="44" fill="#ff6fa3"/>
  <ellipse cx="420" cy="420" rx="76" ry="16" fill="none" stroke="#ffd23f" stroke-width="8" transform="rotate(-20 420 420)"/>
  <!-- body -->
  <ellipse cx="236" cy="370" rx="130" ry="80" fill="#ffd23f" stroke="#1b1b1b" stroke-width="12"/>
  <path d="M170 360 Q220 400 280 356" fill="none" stroke="#e6b400" stroke-width="12" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="276" cy="226" r="86" fill="#ffd23f" stroke="#1b1b1b" stroke-width="12"/>
  <!-- beak -->
  <path d="M340 232 Q412 222 410 252 Q400 280 336 268 Z" fill="#ff8c1a" stroke="#1b1b1b" stroke-width="10" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="300" cy="206" r="18" fill="#1b1b1b"/>
  <circle cx="306" cy="200" r="6" fill="#fff"/>
  <!-- helmet -->
  <circle cx="276" cy="226" r="122" fill="#bff6ff" opacity="0.25" stroke="#e8fbff" stroke-width="10"/>
  <path d="M196 150 Q226 120 266 116" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
</svg>
